$kind: http-request
name: Store Transfer
method: POST
url: '{{base_url}}/files/transfer'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
  - key: X-CSRF-TOKEN
    value: '{{csrf_token}}'
  - key: Authorization
    value: 'Bearer {{auth_token}}'
body:
  type: json
  content: |-
    {
      "file_id": "FILE_UUID_HERE",
      "to_department_id": 2,
      "remarks": "Transferring for review"
    }
