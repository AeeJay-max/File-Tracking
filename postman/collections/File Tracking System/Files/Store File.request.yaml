$kind: http-request
name: Store File
method: POST
url: '{{base_url}}/files'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
  - key: X-CSRF-TOKEN
    value: '{{csrf_token}}'
  - key: Authorization
    value: 'Bearer {{auth_token}}'
body:
  type: json
  content: |-
    {
      "title": "Sample File",
      "description": "File description",
      "department_id": 1
    }
