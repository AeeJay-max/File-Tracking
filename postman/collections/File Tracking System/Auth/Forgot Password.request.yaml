$kind: http-request
name: Forgot Password
method: POST
url: '{{base_url}}/forgot-password'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
  - key: X-CSRF-TOKEN
    value: '{{csrf_token}}'
body:
  type: json
  content: |-
    {
      "email": "{{email}}"
    }
