$kind: http-request
name: Reset Password
method: POST
url: '{{base_url}}/reset-password'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
  - key: X-CSRF-TOKEN
    value: '{{csrf_token}}'
body:
  type: json
  content: |-
    {
      "token": "RESET_TOKEN_HERE",
      "email": "{{email}}",
      "password": "newpassword",
      "password_confirmation": "newpassword"
    }
