$kind: http-request
name: Change Password
method: PUT
url: '{{base_url}}/password'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
  - key: X-CSRF-TOKEN
    value: '{{csrf_token}}'
  - key: Authorization
    value: 'Bearer {{auth_token}}'
body:
  type: json
  content: |-
    {
      "current_password": "oldpassword",
      "password": "newpassword",
      "password_confirmation": "newpassword"
    }
