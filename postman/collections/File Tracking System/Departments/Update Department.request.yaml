$kind: http-request
name: Update Department
method: PUT
url: '{{base_url}}/departments/:id'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
  - key: X-CSRF-TOKEN
    value: '{{csrf_token}}'
  - key: Authorization
    value: 'Bearer {{auth_token}}'
body:
  type: json
  content: |-
    {
      "name": "Updated Department Name"
    }
pathVariables:
  - key: id
    value: '1'
