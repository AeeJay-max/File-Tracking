$kind: http-request
name: Store Designation
method: POST
url: '{{base_url}}/designations'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
  - key: X-CSRF-TOKEN
    value: '{{csrf_token}}'
  - key: Authorization
    value: 'Bearer {{auth_token}}'
body:
  type: json
  content: |-
    {
      "name": "Senior Manager"
    }
