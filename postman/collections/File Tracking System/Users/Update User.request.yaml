$kind: http-request
name: Update User
method: PUT
url: '{{base_url}}/users/:id'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
  - key: X-CSRF-TOKEN
    value: '{{csrf_token}}'
  - key: Authorization
    value: 'Bearer {{auth_token}}'
body:
  type: json
  content: |-
    {
      "name": "Updated User",
      "email": "updated@example.com",
      "role": "admin"
    }
pathVariables:
  - key: id
    value: '1'
